<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#071a2e" />
<meta name="description" content="Shiloh Saints 4th Grade Football — roster, coaching staff and game schedule for parents." />

<!-- Icons. Paths are relative so they resolve under the /repo-name/ subpath
     that GitHub Pages serves from. Regenerate with: python3 make-icons.py -->
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />

<!-- Add to Home Screen: launches without Safari chrome, titled "Shiloh Saints".
     black-translucent lets the navy app bar run under the status bar; the bar
     already reserves env(safe-area-inset-top). -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Shiloh Saints" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Shiloh Saints · Team Hub</title>
<script>
  // Runs before paint: if this browser already entered the code, skip the gate.
  try { if (localStorage.getItem("shiloh.gate") === "ok")
          document.documentElement.classList.add("unlocked"); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
/* ═══════════════════════════════════════════════════════════
   Shiloh Saints — mobile-first team hub.
   Base styles target the phone; the min-width blocks below
   scale the same markup up to the full desktop web view.
   ═══════════════════════════════════════════════════════════ */

:root{
  --navy:#071a2e;
  --navy-2:#0c2741;
  --navy-3:#12365a;
  --accent:#2596be;
  --paper:#eef1f5;
  --ink:#0d1b2a;
  --muted:#5b6b7c;
  --line:#e2e7ed;
  --win:#1f9d57;
  --loss:#d8553f;
  --card-w:280px;
  --tabbar-h:calc(60px + env(safe-area-inset-bottom, 0px));
  --radius:20px;
}

*{box-sizing:border-box;margin:0;padding:0;}
/* our display:flex rules would otherwise beat the UA's [hidden] display:none */
[hidden]{display:none !important;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:"Roboto",system-ui,-apple-system,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
body.is-locked{overflow:hidden;}
button,input{font-family:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px;}
img{max-width:100%;}

.app{position:relative;min-height:100vh;display:flex;flex-direction:column;}
.app-backdrop{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(700px 400px at 80% -10%, rgba(37,150,190,.10), transparent 60%);
}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ── PASSWORD GATE ────────────────────────────────────────── */
html.unlocked #gate{display:none;}
html:not(.unlocked) .app,
html:not(.unlocked) #modal{display:none !important;}
.gate{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;
  background:
    radial-gradient(900px 520px at 78% -10%, rgba(37,150,190,.22), transparent 60%),
    linear-gradient(160deg,#071a2e 0%,#04101d 100%);
  color:#fff;overflow:auto;
}
.gate-card{width:100%;max-width:340px;text-align:center;}
.gate-mark{
  height:86px;aspect-ratio:1202/1308;margin:0 auto 20px;display:grid;place-items:center;
  background:#fff;border-radius:16px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.gate-mark img{width:100%;height:100%;object-fit:contain;display:block;}
.gate-mark.no-photo{background:none;padding:0;box-shadow:none;aspect-ratio:1;}
.gate-mark.no-photo .mark-fallback{
  width:100%;height:100%;display:grid;place-items:center;background:#fff;color:var(--navy);
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:30px;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
}
.gate-title{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:30px;letter-spacing:.5px;}
.gate-sub{font-size:13px;color:#9fb3c6;margin-top:5px;}
.gate-form{margin-top:28px;}
.gate-label{display:block;font-size:12.5px;color:#aebfce;margin-bottom:12px;letter-spacing:.3px;}
.pin{display:flex;gap:10px;justify-content:center;}
.pin input{
  width:56px;height:64px;text-align:center;
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:28px;color:#fff;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.18);
  border-radius:14px;outline:none;transition:.16s;-webkit-text-security:disc;
}
.pin input:focus{border-color:var(--accent);background:rgba(37,150,190,.16);}
.pin.is-bad input{border-color:#e4614f;background:rgba(228,97,79,.12);}
.pin.is-bad{animation:shake .35s;}
@keyframes shake{
  0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);}
  40%{transform:translateX(7px);}  60%{transform:translateX(-4px);} 80%{transform:translateX(4px);}
}
.gate-err{min-height:18px;margin-top:12px;font-size:12.5px;color:#ff9d8f;}
.gate-go{
  width:100%;margin-top:6px;padding:15px;border:0;border-radius:14px;
  background:var(--accent);color:#fff;font-family:inherit;font-weight:700;font-size:15px;
}
.gate-foot{margin-top:18px;font-size:11.5px;color:#6f8499;}
@media(max-width:360px){ .pin input{width:48px;height:58px;font-size:24px;} }

/* ── TOP APP BAR (mobile) ─────────────────────────────────── */
.appbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;z-index:25;
  padding:calc(env(safe-area-inset-top, 0px) + 12px) 18px 12px;
  background:linear-gradient(180deg,var(--navy) 0%,#06182b 100%);
  color:#fff;box-shadow:0 4px 16px -8px rgba(7,26,46,.5);
}
.mbrand{display:flex;align-items:center;gap:11px;min-width:0;}
/* The SC logo ships on an opaque white background whose navy matches this bar
   exactly, so it gets a white badge sized to the artwork's own 1202:1308 ratio —
   the image's background blends into the plate and reads as one mark. */
.mmark{
  height:46px;aspect-ratio:1202/1308;flex:0 0 auto;display:grid;place-items:center;
  border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;
  background:#fff;border-radius:9px;padding:3px;
  box-shadow:0 2px 10px rgba(0,0,0,.28);
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:16px;
  color:var(--navy);
}
.mmark img,.brand-mark img{width:100%;height:100%;object-fit:contain;display:block;}
/* If the logo file goes missing, drop the plate and show the hexagon monogram. */
.mark-fallback{display:none;}
/* Scoped to the two logo marks — the player/coach photo hosts also carry
   .no-photo and must keep their own sizing. */
.mmark.no-photo,.brand-mark.no-photo{background:none;padding:0;box-shadow:none;aspect-ratio:1;}
.mmark.no-photo .mark-fallback,.brand-mark.no-photo .mark-fallback{
  width:100%;height:100%;display:grid;place-items:center;background:#fff;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
}
.mbrand-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0;}
.mbrand-txt b{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:16px;letter-spacing:.3px;}
.mbrand-txt span{font-size:10.5px;color:#9fb3c6;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mrec{
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:22px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  padding:5px 13px;border-radius:12px;flex:0 0 auto;
}
.mrec i{color:var(--accent);font-style:normal;margin:0 3px;}

/* ── SIDEBAR / BOTTOM TAB BAR ─────────────────────────────── */
.side{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  display:flex;padding:7px 8px calc(env(safe-area-inset-bottom, 6px) + 7px);
  background:rgba(255,255,255,.93);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  backdrop-filter:blur(16px) saturate(160%);
  border-top:1px solid var(--line);
  box-shadow:0 -4px 20px -10px rgba(7,26,46,.25);
}
.brand,.side-record,.side-foot{display:none;}
.nav{display:flex;width:100%;justify-content:space-around;}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:none;border:0;color:var(--muted);
  font-size:11px;font-weight:500;padding:7px 4px;border-radius:12px;
  min-height:48px;transition:color .16s;
}
.nav-item svg{width:23px;height:23px;}
.nav-item.is-active{color:var(--accent);}
.nav-count{display:none;}

/* ── MAIN ─────────────────────────────────────────────────── */
.main{
  position:relative;z-index:1;flex:1;
  padding:18px 16px calc(var(--tabbar-h) + 36px);
}
.topbar{display:flex;flex-direction:column;gap:14px;margin-bottom:16px;}
.topbar h1{
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:25px;
  letter-spacing:.3px;color:var(--navy);line-height:1.1;
}
.topbar-titles p{color:var(--muted);font-size:13px;margin-top:4px;}
.search{
  display:flex;align-items:center;gap:9px;background:#fff;
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  color:var(--muted);box-shadow:0 2px 8px rgba(7,26,46,.04);
}
.search input{
  border:0;outline:0;font-size:16px;flex:1;min-width:0;
  color:var(--ink);background:none;
}
.search-x{
  border:0;background:#eef1f5;border-radius:50%;
  width:24px;height:24px;flex:0 0 24px;color:var(--muted);font-size:16px;line-height:1;
}

/* ── GAME FILM LINK (box score) ───────────────────────────── */
.filmlink{
  display:flex;align-items:center;gap:13px;text-decoration:none;
  background:linear-gradient(180deg,#e2382b 0%,#c4291e 100%);
  color:#fff;border-radius:14px;padding:11px 16px 11px 11px;
  box-shadow:0 8px 20px -10px rgba(196,41,30,.85);
  transition:filter .16s,transform .16s;
}
.filmlink-play{
  width:52px;height:36px;flex:0 0 auto;background:#fff;border-radius:9px;
  display:grid;place-items:center;color:#d02a1e;
  box-shadow:0 1px 3px rgba(0,0,0,.18);
}
.filmlink-txt{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:17px;letter-spacing:.3px;flex:1;}
.filmlink-out{opacity:.75;flex:0 0 auto;}
.filmlink:active{transform:translateY(1px);}

.toolbar{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;}
/* No overflow scrolling here — it would clip the Options popover, and with
   only Sort + Options left the row wraps comfortably instead. */
.opts{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  justify-content:space-between;
}
.optgrp{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex:0 0 auto;}
.optgrp>span{flex:0 0 auto;}
.segbtn{
  font-size:13px;border:0;background:none;color:var(--muted);
  padding:7px 11px;border-radius:9px;font-weight:500;min-height:34px;
}
.segbtn.is-on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(7,26,46,.08);font-weight:700;}

/* ── OPTIONS MENU (card style) ────────────────────────────── */
.menu-wrap{position:relative;flex:0 0 auto;}
.menu-btn{
  display:flex;align-items:center;gap:7px;
  font-size:13px;font-weight:500;color:var(--muted);
  background:#fff;border:1px solid var(--line);
  padding:8px 14px;border-radius:10px;min-height:36px;transition:.16s;
}
.menu-btn.is-on,.menu-btn[aria-expanded="true"]{
  border-color:var(--accent);color:var(--navy);font-weight:700;
}
.menu{
  position:absolute;right:0;top:calc(100% + 8px);z-index:30;min-width:172px;
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;
  box-shadow:0 12px 32px -10px rgba(7,26,46,.32);
}
.menu-h{
  font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:7px 10px 6px;
}
.menu-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  background:none;border:0;color:var(--ink);font-size:14px;text-align:left;
  padding:10px 10px;border-radius:9px;min-height:40px;
}
.menu-item.is-on{color:var(--navy);font-weight:700;}
.menu-item.is-on::after{
  content:"";width:7px;height:12px;flex:0 0 auto;margin-right:2px;
  border:solid var(--accent);border-width:0 2.4px 2.4px 0;transform:rotate(45deg);
}

.grid{display:grid;gap:18px;grid-template-columns:1fr;max-width:420px;margin:0 auto;}
.grid-coach{gap:16px;max-width:480px;}
.empty{padding:56px 20px;text-align:center;color:var(--muted);font-size:15px;}

/* ── FLIP CARD SHELL ──────────────────────────────────────── */
.tc{
  width:100%;aspect-ratio:320/430;perspective:1400px;
  display:block;cursor:pointer;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}
/* The flip animates each face independently rather than rotating a
   preserve-3d parent: iOS WebKit ignores backface-visibility on elements
   that also clip (overflow:hidden + border-radius), which leaked the front
   face through — mirrored — on iPhones. Faces counter-rotate and swap
   visibility while edge-on, so no backface is ever relied upon. The
   symmetric easing keeps the 90° point at exactly half the duration. */
.tc-inner{position:relative;width:100%;height:100%;perspective:1400px;}
.tc-face{
  position:absolute;inset:0;border-radius:var(--radius);overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transform:rotateY(0deg);
  transition:transform .6s cubic-bezier(.45,0,.55,1), visibility 0s linear .3s;
}
.tc-back{transform:rotateY(-180deg);visibility:hidden;}
.tc.is-flipped .tc-front{transform:rotateY(180deg);visibility:hidden;}
.tc.is-flipped .tc-back{transform:rotateY(0deg);visibility:visible;}
.tc-front{box-shadow:0 0 0 1.5px rgba(37,150,190,.4) inset, 0 16px 30px -12px rgba(7,26,46,.55);}

.tc-flip-hint{
  position:absolute;right:12px;bottom:12px;z-index:6;
  display:flex;align-items:center;gap:5px;border:0;
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:10px;letter-spacing:1.2px;
  color:#fff;background:rgba(7,26,46,.55);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  padding:7px 10px;border-radius:20px;opacity:.9;transition:opacity .2s;
}

/* ── PHOTO FRONT (classic + bold) ─────────────────────────── */
.tcf-photo{position:absolute;inset:0;background:var(--navy);}
.tcf-bg{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 8%, var(--navy-3), var(--navy) 55%, #050f1b 100%);}
.tcf-hex{
  position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
  width:88%;aspect-ratio:1;
  clip-path:polygon(50% 1%,100% 25%,100% 75%,50% 99%,0 75%,0 25%);
  background:var(--accent);filter:drop-shadow(0 0 16px rgba(37,150,190,.85));
}
.tcf-hex::after{
  content:"";position:absolute;inset:6px;
  clip-path:polygon(50% 1%,100% 25%,100% 75%,50% 99%,0 75%,0 25%);
  background:radial-gradient(120% 80% at 50% 8%, var(--navy-3), var(--navy) 60%, #061321 100%);
}
.tcf-bignum{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:300px;line-height:1;
  color:rgba(255,255,255,.07);z-index:1;letter-spacing:-6px;
}
.tcf-wedge{
  position:absolute;left:0;right:0;bottom:0;height:44%;z-index:3;
  background:linear-gradient(180deg,transparent 0%,rgba(37,150,190,.55) 30%,var(--accent) 58%);
  clip-path:polygon(0 26%,100% 0,100% 100%,0 100%);
}
.tcf-img{
  position:absolute;left:50%;top:-3%;transform:translateX(-50%);
  width:108%;height:120%;object-fit:cover;object-position:center top;z-index:2;
}
.tcf-shade{
  position:absolute;inset:0;z-index:3;
  background:linear-gradient(180deg,rgba(7,26,46,.30) 0%,transparent 22% 46%,rgba(7,26,46,.80) 76%,rgba(5,15,27,.98) 100%);
}
.tcf-foil{
  position:absolute;inset:0;z-index:5;pointer-events:none;
  background:linear-gradient(125deg,transparent 38%,rgba(255,255,255,.16) 48%,transparent 58%);
  mix-blend-mode:screen;opacity:.7;
}
.tcf-top{position:absolute;top:13px;left:13px;right:13px;z-index:4;display:flex;align-items:flex-start;justify-content:space-between;}
.tcf-numchip{
  --chip:var(--accent);--chipfg:#fff;
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:26px;line-height:1;
  min-width:46px;height:46px;padding:0 8px;display:grid;place-items:center;
  background:var(--chip);color:var(--chipfg);border-radius:13px;
  box-shadow:0 4px 12px rgba(0,0,0,.3);border:1.5px solid rgba(255,255,255,.25);
}
.tcf-pospill{
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;
  color:#fff;background:rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  border:1px solid rgba(255,255,255,.25);padding:6px 11px;border-radius:20px;
}
.tcf-plate{position:absolute;left:18px;right:18px;bottom:16px;z-index:4;}
.tcf-nick{font-size:12.5px;color:var(--accent);font-weight:500;font-style:italic;margin-bottom:3px;}
.tcf-name{
  font-family:"Roboto Condensed",sans-serif;font-weight:400;font-size:27px;line-height:1.02;
  color:#fff;text-transform:uppercase;letter-spacing:.4px;
}
.tcf-name b{font-weight:700;}
.tcf-pos{font-size:12px;color:#aebfce;margin-top:5px;letter-spacing:.4px;}

/* bold variant overrides */
.tc-bold .tcf-bg{background:linear-gradient(155deg,var(--navy-3) 0%,var(--navy) 48%,#050f1b 100%);}
.tc-bold .tcf-shade{display:none;}
.tc-bold .tcf-bignum{
  left:auto;right:6px;bottom:2px;top:auto;transform:none;
  font-size:170px;line-height:.78;color:rgba(7,26,46,.28);z-index:3;letter-spacing:-8px;
}
.tc-bold .tcf-plate{bottom:18px;}
.tc-bold .tcf-nick{color:#eafaff;font-style:normal;font-weight:500;}
.tc-bold .tcf-name{text-shadow:0 2px 10px rgba(7,26,46,.35);}
.tc-bold .tcf-pos{color:rgba(255,255,255,.92);}

/* ── MODERN FRONT ─────────────────────────────────────────── */
.tcm{
  position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;
  border:1px solid var(--line);border-radius:var(--radius);
}
.tc-modern .tc-front{box-shadow:0 10px 26px -14px rgba(7,26,46,.4);}
.tcm-photowrap{position:relative;height:66%;border-radius:19px 19px 0 0;overflow:hidden;background:var(--navy);}
.tcm-photobg{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%, var(--navy-3), var(--navy) 70%);}
.tcm-img{position:absolute;left:50%;top:-4%;transform:translateX(-50%);width:110%;height:150%;object-fit:cover;object-position:center top;}
.tcm-numchip{
  position:absolute;top:12px;right:12px;z-index:3;
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:18px;
  background:var(--chip,var(--accent));color:var(--chipfg,#fff);
  padding:5px 11px;border-radius:11px;box-shadow:0 4px 10px rgba(0,0,0,.25);
}
.tcm-body{padding:15px 18px 16px;display:flex;flex-direction:column;gap:3px;}
.tcm-pos{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);}
.tcm-name{font-family:"Roboto Condensed",sans-serif;font-weight:400;font-size:23px;color:var(--navy);text-transform:uppercase;line-height:1.05;}
.tcm-name b{font-weight:700;}
.tcm-nick{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:5px;}
.tcm-nick svg{color:var(--accent);flex:0 0 auto;}

/* ── PHOTO FALLBACK (no asset available) ──────────────────── */
.ph{position:absolute;inset:0;z-index:1;display:grid;place-items:center;}
.ph-mono{
  font-family:"Roboto Condensed",sans-serif;font-weight:700;
  font-size:64px;letter-spacing:2px;color:rgba(255,255,255,.16);
}
.no-photo .tcf-img,.no-photo .tcm-img,.no-photo>img{display:none;}

/* ── COMPACT CARD (no portrait) ───────────────────────────── */
/* One third the height of a full card, so a photoless roster reads as a
   list instead of a wall of empty art panels. */
.tc.is-compact{aspect-ratio:320/143;}
.tc.is-compact .tc-flip-hint{display:none;}
.tc.is-compact .tc-front{box-shadow:0 0 0 1.5px rgba(37,150,190,.32) inset,0 8px 18px -10px rgba(7,26,46,.5);}

.tcc{position:absolute;inset:0;display:flex;align-items:center;gap:14px;
  padding:0 16px;overflow:hidden;
  background:linear-gradient(120deg,var(--navy-3) 0%,var(--navy) 55%,#050f1b 100%);}
.tcc-mono{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:78px;line-height:1;
  color:rgba(255,255,255,.06);letter-spacing:-2px;pointer-events:none;}
.tcc-num{flex:0 0 auto;min-width:52px;height:52px;padding:0 8px;display:grid;place-items:center;
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:26px;
  background:var(--accent);color:#fff;border-radius:13px;
  border:1.5px solid rgba(255,255,255,.22);box-shadow:0 4px 12px rgba(0,0,0,.3);}
.tcc-body{min-width:0;z-index:1;}
.tcc-nick{font-size:11.5px;color:var(--accent);font-weight:500;font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Long names (Flannagan, Crittendon) wrap rather than truncate — the compact
   card has vertical room for two lines. */
.tcc-name{font-family:"Roboto Condensed",sans-serif;font-weight:400;font-size:20px;
  color:#fff;text-transform:uppercase;line-height:1.08;letter-spacing:.3px;
  overflow-wrap:anywhere;}
.tcc-name b{font-weight:700;}
.tcc-pos{font-size:11.5px;color:#9fb3c6;margin-top:2px;letter-spacing:.3px;}

.tccb{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;
  padding:13px 15px;border-radius:var(--radius);
  background:linear-gradient(150deg,var(--navy-2),var(--navy) 70%,#040e1a);
  border:1.5px solid rgba(37,150,190,.4);}
.tccb-fact{flex:1;min-height:0;}
.tccb-label{display:block;font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:10px;
  letter-spacing:1.1px;text-transform:uppercase;color:var(--accent);margin-bottom:3px;}
.tccb-fact p{font-size:12.5px;line-height:1.4;color:#dce6ef;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.tccb-open{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  flex:0 0 auto;font-weight:700;font-size:12.5px;color:#fff;background:var(--accent);
  border:0;border-radius:10px;padding:9px;}
@media (hover:hover) and (pointer:fine){ .tccb-open:hover{filter:brightness(1.08);} }

/* ── CARD BACK ────────────────────────────────────────────── */
.tcb{
  position:absolute;inset:0;color:#fff;padding:20px 20px 16px;
  background:linear-gradient(165deg,var(--navy-2),var(--navy) 70%,#040e1a);
  display:flex;flex-direction:column;
  border:1.5px solid rgba(37,150,190,.4);border-radius:var(--radius);
}
.tcb-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.1);}
.tcb-num{
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:24px;
  width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;border-radius:12px;
  background:var(--chip,var(--accent));color:var(--chipfg,#fff);
}
.tcb-name{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:19px;letter-spacing:.3px;line-height:1.1;}
.tcb-pos{font-size:11.5px;color:#9fb3c6;margin-top:2px;}
.tcb-rows{padding:14px 0 4px;display:flex;flex-direction:column;}
.tcb-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px;}
.tcb-k{color:#8fa6ba;flex:0 0 auto;}
.tcb-v{font-weight:500;text-align:right;}
.tcb-fact{margin-top:auto;background:rgba(37,150,190,.12);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;padding:12px 14px;}
.tcb-fact-label{
  display:flex;align-items:center;gap:6px;
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:11px;
  letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:5px;
}
.tcb-fact p{font-size:13px;line-height:1.45;color:#dce6ef;}
.tcb-open{
  margin-top:13px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  font-weight:700;font-size:13.5px;color:#fff;background:var(--accent);
  border:0;border-radius:12px;padding:13px;transition:filter .16s;
}
.tcb-flipback{text-align:center;font-size:10px;color:#6f8499;margin-top:9px;letter-spacing:.3px;}

/* ── COACH CARD ───────────────────────────────────────────── */
.cc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 8px 22px -16px rgba(7,26,46,.4);transition:.2s;}
.cc-top{position:relative;height:118px;background:linear-gradient(150deg,var(--navy-3),var(--navy) 75%);}
.cc-top::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.025) 22px 23px);}
.cc-avatar{
  position:absolute;left:24px;bottom:-34px;width:88px;height:88px;border-radius:50%;
  overflow:hidden;border:4px solid #fff;box-shadow:0 6px 16px rgba(7,26,46,.28);z-index:2;
  background:linear-gradient(150deg,var(--navy-3),var(--navy));display:grid;place-items:center;
}
.cc-avatar img{width:100%;height:100%;object-fit:cover;object-position:center 8%;}
.cc-avatar .ph-mono{font-size:28px;color:rgba(255,255,255,.55);position:absolute;}
.cc-tag{
  position:absolute;top:14px;right:14px;
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;
  text-transform:uppercase;color:var(--navy);background:#fff;padding:5px 11px;border-radius:20px;white-space:nowrap;
}
.cc-body{padding:44px 24px 22px;}
.cc-name{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:20px;color:var(--navy);letter-spacing:.2px;}
.cc-role{font-size:13px;color:var(--accent);font-weight:500;margin-top:2px;}
.cc-motto{font-size:14px;font-style:italic;color:var(--ink);margin:14px 0 10px;line-height:1.4;}
.cc-fact{font-size:12.5px;color:var(--muted);line-height:1.5;}
/* Name-and-role only: pull the navy band in so the card isn't top-heavy. */
.cc-brief .cc-top{height:92px;}
.cc-brief .cc-avatar{width:76px;height:76px;bottom:-28px;}
.cc-brief .cc-body{padding:38px 24px 20px;}

/* ── SCHEDULE ─────────────────────────────────────────────── */
.sched{display:flex;flex-direction:column;gap:11px;max-width:880px;}
.game{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 16px;
}
.game-week{
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:12px;letter-spacing:.5px;
  color:var(--muted);text-transform:uppercase;flex:0 0 auto;
}
.game-main{flex:1 0 100%;order:2;min-width:0;}
.game-opp{display:flex;align-items:center;gap:10px;font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:17px;color:var(--navy);line-height:1.2;}
.ha{font-size:11px;font-weight:700;letter-spacing:.5px;padding:3px 7px;border-radius:6px;flex:0 0 auto;}
.ha.home{background:rgba(37,150,190,.14);color:var(--accent);}
.ha.away{background:#eef1f5;color:var(--muted);}
.game-when{font-size:12.5px;color:var(--muted);margin-top:4px;}
.game-right{margin-left:auto;flex:0 0 auto;text-align:right;order:1;}
.game-res{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:17px;padding:5px 12px;border-radius:10px;white-space:nowrap;}
.game-res.win{color:var(--win);background:rgba(31,157,87,.12);}
.game-res.loss{color:var(--loss);background:rgba(216,85,63,.12);}
.game-upc{font-size:13px;color:var(--muted);font-weight:500;}
.game-badge{
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.8px;
  text-transform:uppercase;color:#fff;background:var(--accent);padding:6px 12px;border-radius:10px;white-space:nowrap;
}
.game-badge.playoff{background:var(--navy);}
.game.is-next{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,150,190,.12);}
.game.is-playoff{background:linear-gradient(180deg,#fff,#f6f9fb);border-style:dashed;}

/* ── DETAIL SHEET / MODAL ─────────────────────────────────── */
.modal{
  position:fixed;inset:0;z-index:50;background:rgba(5,15,27,.7);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .2s;
}
.modal[hidden]{display:none;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal-card{
  display:flex;flex-direction:column;background:#fff;position:relative;
  width:100%;max-height:94vh;max-height:94dvh;overflow:auto;
  border-radius:24px 24px 0 0;
  box-shadow:0 40px 80px -20px rgba(0,0,0,.6);
  animation:sheet .3s cubic-bezier(.2,.8,.3,1);
  -webkit-overflow-scrolling:touch;
}
@keyframes sheet{from{transform:translateY(40px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
.modal-x{
  position:absolute;top:16px;right:16px;z-index:10;
  width:38px;height:38px;border-radius:50%;border:0;
  background:rgba(255,255,255,.92);color:var(--navy);font-size:24px;line-height:1;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.modal-photo{position:relative;flex:none;height:46vh;height:46dvh;min-height:260px;background:var(--navy);overflow:hidden;}
.modal-bg{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 6%, var(--navy-3), var(--navy) 55%, #050f1b);}
.modal-hex{
  position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:76%;aspect-ratio:1;
  clip-path:polygon(50% 1%,100% 25%,100% 75%,50% 99%,0 75%,0 25%);
  background:var(--accent);filter:drop-shadow(0 0 22px rgba(37,150,190,.8));
}
.modal-hex::after{
  content:"";position:absolute;inset:7px;
  clip-path:polygon(50% 1%,100% 25%,100% 75%,50% 99%,0 75%,0 25%);
  background:radial-gradient(120% 80% at 50% 6%, var(--navy-3), var(--navy) 60%, #061321);
}
.modal-photo img{position:absolute;left:50%;top:-2%;transform:translateX(-50%);width:104%;height:114%;object-fit:cover;object-position:center top;z-index:2;}
.modal-shade{position:absolute;inset:0;z-index:3;background:linear-gradient(180deg,transparent 50%,rgba(5,15,27,.85));}
.modal-num{
  position:absolute;top:18px;left:18px;z-index:4;
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:32px;
  min-width:58px;height:58px;padding:0 10px;display:grid;place-items:center;border-radius:16px;
  background:var(--chip,var(--accent));color:var(--chipfg,#fff);
  box-shadow:0 6px 16px rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.25);
}
.modal-plate{position:absolute;left:22px;right:22px;bottom:20px;z-index:4;}
.modal-nick{font-size:14px;font-style:italic;color:var(--accent);margin-bottom:4px;}
.modal-name{font-family:"Roboto Condensed",sans-serif;font-weight:400;font-size:31px;color:#fff;text-transform:uppercase;line-height:1;}
.modal-name b{font-weight:700;}
.modal-info{flex:1;padding:26px 22px calc(env(safe-area-inset-bottom, 0px) + 26px);display:flex;flex-direction:column;}
.modal-pos{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);}
.modal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 22px;}
.ms{background:var(--paper);border-radius:14px;padding:13px 8px;text-align:center;}
.ms span{display:block;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.ms b{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:22px;color:var(--navy);}
/* A multi-position list ("QB,RB,LB") needs to step down to fit its tile. */
.ms-pos b{font-size:15px;letter-spacing:.2px;overflow-wrap:anywhere;}
.modal-fact{background:var(--navy);color:#fff;border-radius:16px;padding:18px 20px;}
.modal-fact-h{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);margin-bottom:7px;}
.modal-fact p{font-size:14.5px;line-height:1.5;color:#dce6ef;}

/* ── SEASON STATS (full card) ─────────────────────────────── */
.stats{margin-top:24px;border-top:1px solid var(--line);padding-top:20px;}
.stats-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.stats-h h3{
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:17px;
  letter-spacing:.4px;text-transform:uppercase;color:var(--navy);
}
.stats-h span{font-size:11.5px;color:var(--muted);}
.statgrp{margin-top:16px;}
.statgrp-h{
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:11px;
  letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);margin-bottom:8px;
}
/* Fixed 4-up: auto-fit would stretch a lone tile across the whole row. */
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.st{background:var(--paper);border-radius:12px;padding:10px 6px;text-align:center;}
.st span{display:block;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.st b{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:19px;color:var(--navy);}
.stats-empty{margin-top:14px;font-size:13.5px;color:var(--muted);}

/* ── MENU / SEASON LIST ROWS ──────────────────────────────── */
.mlist{display:flex;flex-direction:column;gap:10px;max-width:560px;}
.mrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:16px 16px;font:inherit;cursor:pointer;transition:.16s;}
.mrow-ico{flex:0 0 auto;width:40px;height:40px;display:grid;place-items:center;
  border-radius:12px;background:var(--paper);color:var(--accent);}
.mrow-yr{flex:0 0 auto;min-width:56px;height:40px;display:grid;place-items:center;
  border-radius:12px;background:var(--navy);color:#fff;
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:16px;}
.mrow-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.mrow-txt b{font-family:"Roboto Condensed",sans-serif;font-size:18px;color:var(--navy);letter-spacing:.2px;}
.mrow-txt span{font-size:12.5px;color:var(--muted);}
.mrow-go{flex:0 0 auto;color:var(--muted);}

/* career table: totals row reads like the "Pro Totals" line on a card back */
.career{margin-top:24px;}
.career .pstat-scroll{margin-top:12px;}
.career table{min-width:420px;}
.career .pstat-name{font-family:"Roboto Condensed",sans-serif;font-weight:700;
  color:var(--navy);font-size:14px;}
.career tbody tr.career-total{background:var(--paper);}
.career tbody tr.career-total td{border-top:2px solid var(--navy);}
.career tbody tr.career-total .pstat-name{letter-spacing:.5px;text-transform:uppercase;font-size:12.5px;}

/* ── BOX SCORE SUB-TABS + PLAY-BY-PLAY ────────────────────── */
.bstabs{display:flex;gap:6px;margin:22px 0 4px;max-width:640px;
  background:#e7ebf0;padding:4px;border-radius:12px;}
.bstab{flex:1;border:0;background:none;color:var(--muted);
  font-size:14px;font-weight:500;padding:10px 12px;border-radius:9px;min-height:40px;transition:.16s;}
.bstab.is-on{background:#fff;color:var(--navy);font-weight:700;box-shadow:0 1px 4px rgba(7,26,46,.1);}

.pbp{margin-top:18px;max-width:640px;display:flex;flex-direction:column;gap:14px;}
.drive{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;}
.drive-h{display:flex;align-items:center;gap:9px;padding:11px 14px;
  background:var(--paper);border-bottom:1px solid var(--line);}
.drive-tag{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:11px;
  letter-spacing:1px;text-transform:uppercase;color:#fff;background:var(--navy);
  padding:4px 10px;border-radius:20px;}
.drive.is-off .drive-tag{background:var(--accent);}
.drive-n{font-size:12.5px;color:var(--muted);font-weight:500;}
.drive-note{margin-left:auto;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--muted);font-weight:700;}
.plays{list-style:none;counter-reset:play;}
.play{display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-bottom:1px solid var(--line);font-size:14px;line-height:1.35;}
.play:last-child{border-bottom:0;}
.play-txt{flex:1;min-width:0;}
.play-txt b{font-family:"Roboto Condensed",sans-serif;color:var(--accent);}
.play-yds{flex:0 0 auto;font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:15px;
  min-width:44px;text-align:right;color:var(--muted);}
.play-yds.pos{color:var(--win);}
.play-yds.neg{color:var(--loss);}
.play-tag{flex:0 0 auto;font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:10px;
  letter-spacing:.8px;text-transform:uppercase;padding:4px 8px;border-radius:6px;}
.play-tag.td{background:var(--win);color:#fff;}
.play-tag.to{background:var(--loss);color:#fff;}
.play-tag.sk{background:rgba(7,26,46,.08);color:var(--navy);}
.play-tag.ok{background:rgba(31,157,87,.14);color:var(--win);}
.play.is-score{background:rgba(31,157,87,.07);}
.play.is-turnover{background:rgba(216,85,63,.07);}
.play.is-opp .play-yds{color:var(--loss);}
.play.is-flag{color:var(--muted);font-style:italic;}
.play.is-conv{background:#fbfcfd;font-size:13px;color:var(--muted);}
.play.is-conv .play-txt b{color:var(--muted);}
@media (hover:hover) and (pointer:fine){ .bstab:hover{color:var(--navy);} }

/* ── TEAM STATS + BOX SCORE ───────────────────────────────── */
.tstat-top{max-width:520px;}
.bs-sec{margin-top:26px;max-width:640px;}
.bs-h{
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:17px;
  letter-spacing:.5px;text-transform:uppercase;color:var(--navy);margin-bottom:10px;
}
.tbl{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;}
.tbl-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 16px;font-size:14px;color:var(--muted);
  border-bottom:1px solid var(--line);
}
.tbl-row:last-child{border-bottom:0;}
.tbl-row b{font-family:"Roboto Condensed",sans-serif;font-size:17px;color:var(--navy);}

.lead-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.lead{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;}
.lead-k{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--accent);font-weight:700;}
.lead-v{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:30px;color:var(--navy);line-height:1.1;margin:2px 0 3px;}
.lead-p{font-size:12.5px;color:var(--muted);}
.lead-p b{color:var(--navy);}
/* leader cards punch through to the full category breakdown */
.lead{width:100%;text-align:left;position:relative;border:1px solid var(--line);
  cursor:pointer;font:inherit;transition:transform .14s,box-shadow .14s,border-color .14s;}
.lead-go{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);
  display:flex;}
.lead:active{transform:translateY(1px);}
/* Rank sits in its own gutter so it doesn't read as part of the jersey number. */
.pstat .rank{display:inline-block;min-width:18px;font-family:"Roboto Condensed",sans-serif;
  font-weight:700;font-size:12px;color:#9fb0c0;margin-right:12px;text-align:right;}

/* box-score header */
.crumb{
  display:inline-flex;align-items:center;gap:8px;border:0;background:none;
  color:var(--accent);font-size:17px;font-weight:700;letter-spacing:.2px;
  padding:2px 10px 2px 0;margin:0 0 14px -4px;min-height:40px;cursor:pointer;
}
.crumb svg{flex:0 0 auto;}
.crumb:active{opacity:.7;}
.bs-head{background:var(--navy);color:#fff;border-radius:18px;padding:16px 20px;max-width:640px;}
.bs-meta{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:#8fa6ba;margin-bottom:10px;}
.bs-line{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:7px 0;}

/* team-vs-opponent comparison rows */
.cmp-head,.cmp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;}
.cmp-head{padding:0 16px 8px;}
.cmp-head span{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700;}
.cmp-head span:first-child{text-align:right;}
.cmp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:6px;}
.cmp span{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:16px;color:var(--navy);text-align:right;}
.cmp span:last-child{text-align:left;color:var(--muted);}
.cmp em{font-style:normal;font-size:11.5px;color:var(--muted);text-align:center;min-width:112px;}

/* per-player stat tables */
.pstat{margin-top:24px;max-width:640px;}
.pstat-h{
  font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:12px;
  letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);margin-bottom:8px;
}
.pstat-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border:1px solid var(--line);border-radius:14px;}
.pstat table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:340px;}
.pstat th,.pstat td{padding:10px 8px;text-align:center;white-space:nowrap;}
.pstat thead th{
  font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);
  font-weight:700;border-bottom:1px solid var(--line);
}
.pstat tbody tr{border-bottom:1px solid var(--line);}
.pstat tbody tr:last-child{border-bottom:0;}
.pstat td{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:15px;color:var(--navy);}
.pstat .pstat-name{text-align:left;padding-left:14px;font-family:"Roboto",sans-serif;font-weight:400;font-size:13.5px;}
.pstat td.pstat-name b{font-family:"Roboto Condensed",sans-serif;color:var(--accent);margin-right:5px;}

/* played games are tappable */
button.game{width:100%;text-align:left;font:inherit;cursor:pointer;}
/* order:1 keeps the chevron trailing the result on the mobile two-row layout. */
.game-go{order:1;margin-left:10px;color:var(--muted);display:flex;flex:0 0 auto;}

/* ═══════════════════════════════════════════════════════════
   TABLET — two-up cards, roomier gutters
   ═══════════════════════════════════════════════════════════ */
@media (min-width:560px){

  .grid-coach{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));max-width:none;}
  .opts{margin:0;padding:0;overflow:visible;justify-content:space-between;flex-wrap:wrap;}
  .game-main{flex:1;order:0;}
  .game-right{order:0;}
  .game-week{flex:0 0 auto;min-width:64px;max-width:104px;}
  .modal{align-items:center;padding:24px;}
  .modal-card{max-width:520px;border-radius:24px;max-height:88vh;}

/* ── DERIVED STATS ─────────────────────────────────────────────
   Nothing below is hand-maintained; it all rolls up from the game lists.
   Every function takes a game list so past seasons reuse the same code. */
const BY_NUM = {};
ROSTER.forEach(p => { BY_NUM[p.num] = p; });

const addInto = (dst, src, keys) => keys.forEach(k => {
  if (src[k] != null) dst[k] = (dst[k] || 0) + src[k];
});

// One player's totals across the given games (defaults to this season).
function seasonStats(num, games) {
  const out = { gp: 0 };
  (games || PLAYED).forEach(g => {
    const s = g.stats; if (!s) return;
    if (wornByOther(g.year, num)) return;   // that jersey was someone else's
    let played = false;
    const r = s.rushing   && s.rushing[num];
    const a = s.passing   && s.passing[num];
    const c = s.receiving && s.receiving[num];
    const d = s.defense   && s.defense[num];
    const k = s.kicking   && s.kicking[num];
    if (r) { out.rush = out.rush || {}; addInto(out.rush, r, ["att","yds","td","twoPt"]); played = true; }
    if (a) { out.pass = out.pass || {}; addInto(out.pass, a, ["c","a","yds","td","int"]); played = true; }
    if (c) { out.rec  = out.rec  || {}; addInto(out.rec,  c, ["rec","yds","td","twoPt"]); played = true; }
    if (d) { out.def  = out.def  || {}; addInto(out.def,  d, ["solo","ast","tfl","sck","int","fr"]); played = true; }
    if (k) { out.kick = out.kick || {}; addInto(out.kick, k, ["xpm","xpa","fgm","fga"]); played = true; }
    if (played) out.gp++;
  });
  if (out.def) out.def.tkl = (out.def.solo || 0) + (out.def.ast || 0);
  return out;
}

// Stats for a jersey number in a given season, whoever wore it.
function seasonStats2(num, games, year) {
  if (wornByOther(year, num)) {
    const out = { gp: 0 };
    (games || []).forEach(g => {
      const st = g.stats; if (!st) return;
      let played = false;
      const r = st.rushing && st.rushing[num], a = st.passing && st.passing[num];
      const c = st.receiving && st.receiving[num], d = st.defense && st.defense[num];
      if (r) { out.rush = out.rush || {}; addInto(out.rush, r, ["att","yds","td","twoPt"]); played = true; }
      if (a) { out.pass = out.pass || {}; addInto(out.pass, a, ["c","a","yds","td","int"]); played = true; }
      if (c) { out.rec  = out.rec  || {}; addInto(out.rec,  c, ["rec","yds","td","twoPt"]); played = true; }
      if (d) { out.def  = out.def  || {}; addInto(out.def,  d, ["solo","ast","tfl","sck","int","fr"]); played = true; }
      if (played) out.gp++;
    });
    if (out.def) out.def.tkl = (out.def.solo || 0) + (out.def.ast || 0);
    return out;
  }
  return seasonStats(num, games);
}

// Career: one row per season the player appeared in, plus the totals row.
function careerStats(num) {
  const rows = SEASONS
    .map(sn => ({ season: sn, s: seasonStats(num, playedIn(sn.games)) }))
    .filter(r => r.s.gp > 0);
  const total = seasonStats(num, SEASONS.flatMap(sn => playedIn(sn.games)));
  return { rows, total };
}

// Team totals across the given games (defaults to this season).
function teamSeason(games) {
  const t = { games:0, points:0, pointsAgainst:0, totalYards:0, rushYds:0, passYds:0,
              td:0, twoPtMade:0, twoPtAtt:0,
              firstDowns:0, firstRush:0, firstPass:0, penalties:0, penaltyYds:0,
              tfl:0, sacks:0, int:0, fr:0, yardsLost:0, yardsAllowed:0, solo:0, ast:0 };
  (games || PLAYED).forEach(g => {
    t.games++; t.points += g.us || 0; t.pointsAgainst += g.them || 0;
    const s = g.stats; if (!s) return;
    addInto(t, s.team, ["totalYards","rushYds","passYds","td","firstDowns",
                        "firstRush","firstPass","penalties","penaltyYds"]);
    if (s.team.def) addInto(t, s.team.def, ["tfl","sacks","int","fr","yardsLost","yardsAllowed"]);
    if (s.team.twoPt) { t.twoPtMade += s.team.twoPt.made || 0; t.twoPtAtt += s.team.twoPt.att || 0; }
    Object.keys(s.defense || {}).forEach(n => {
      t.solo += s.defense[n].solo || 0; t.ast += s.defense[n].ast || 0;
    });
  });
  t.tackles = t.solo + t.ast;
  return t;
}

// Season leader for a given stat path, e.g. s => s.rush && s.rush.yds
function leaderBy(pick, games) {
  const rows = ROSTER.map(p => ({ p, v: pick(seasonStats(p.num, games)) }))
                     .filter(r => r.v != null && r.v > 0)
                     .sort((a, b) => b.v - a.v);
  return rows[0] || null;
}

/* This league does not score like standard football — "2PT conversion" is
   just the familiar name for the play, not its point value. Final scores are
   authoritative as entered, so CONVERSION stays null and the points
   cross-foot never runs. Do not re-derive scores from touchdowns. */
const SCORING = { TD: 6, CONVERSION: null };

/* Sanity-check each played game while entering stats. Warns in the console
   only; never alters the numbers shown. */
function auditGames() {
  PLAYED.forEach(g => {
    const s = g.stats; if (!s) return;
    const sum = (obj, key) => Object.keys(obj || {})
      .reduce((n, k) => n + (obj[k][key] || 0), 0);
    // A passing TD scores the same points as its receiving TD — count once.
    const td    = sum(s.rushing, "td") + sum(s.receiving, "td") + sum(s.returns, "td");
    const twoPt = sum(s.rushing, "twoPt") + sum(s.receiving, "twoPt");

    if (s.team && s.team.td != null && s.team.td !== td)
      console.warn(`[${g.week}] team line says ${s.team.td} TDs, player lines show ${td}.`);

    if (SCORING.CONVERSION != null) {
      const pts = td * SCORING.TD + twoPt * SCORING.CONVERSION
                + sum(s.kicking, "xpm") + sum(s.kicking, "fgm") * 3;
      if (pts !== g.us)
        console.warn(`[${g.week}] player lines total ${pts} pts but the final score says ${g.us}.`);
    } else {
      /* points intentionally not cross-footed — see SCORING above */
    }
  });
}

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const initials = (p) => (p.first[0] + p.last[0]).toUpperCase();

// Jersey numbers with no photo on disk. Populated the first time an image
// fails so later re-renders (sorting, searching) size the card immediately.
const NO_PHOTO = new Set();

// Photos ship as a project asset; when it isn't there (opened standalone) the
// card falls back to a monogram over the same navy art rather than a broken img.
const img = (src, alt, cls) =>
  `<img src="${esc(src)}" alt="${esc(alt)}" class="${cls}" draggable="false"
        loading="lazy" onerror="photoFallback(this)" />`;

// Try the .png twin before giving up and showing the initials monogram, so a
// folder of PNG portraits works without renaming anything.
function photoFallback(el) {
  if (!el.dataset.retried && /\.jpg$/i.test(el.getAttribute("src") || "")) {
    el.dataset.retried = "1";
    el.setAttribute("src", el.getAttribute("src").replace(/\.jpg$/i, ".png"));
    return;
  }
  const host = el.closest(".photo-host");
  if (host) host.classList.add("no-photo");
}

/* Work out which players have a portrait before the grid settles, so cards
   don't resize under the reader mid-scroll. One re-render once all probes
   finish; compact cards carry no <img>, so this can't loop. */
function probePhotos() {
  let pending = ROSTER.length;
  const done = () => { if (--pending === 0 && state.tab === "players") render(); };
  ROSTER.forEach(pl => {
    const jpg = new Image();
    jpg.onload = done;
    jpg.onerror = () => {
      const png = new Image();
      png.onload = done;
      png.onerror = () => { NO_PHOTO.add(pl.num); done(); };
      png.src = pl.photo.replace(/\.jpg$/i, ".png");
    };
    jpg.src = pl.photo;
  });
}
